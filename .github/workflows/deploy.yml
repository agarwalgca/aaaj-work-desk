name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deployment at a time; a queued run waits rather than racing the one ahead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same checks that guard a local commit. A red build should not reach
      # the demo URL.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:sql

      - run: npm run build
        env:
          # Pages serves the app from /<repo>/, so the base has to match or every
          # asset path is wrong.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
